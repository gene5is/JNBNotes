---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <p>{{ page.date | date: "%Y-%m-%d" }}</p>

  {% if page.toc %}
  <div style="background:#f5f5f5; padding:1em; border-radius:8px; margin-bottom:2em;">
    <h4>目录</h4>
    {% include toc.html html=content %}
  </div>
  {% endif %}

  {{ content }}
</article>
