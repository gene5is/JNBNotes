title: 笔记
description: "" # 建议加上双引号，如果为空可以写 ""
baseurl: "/JNBNotes"
url: "https://gene5is.github.io"

theme: jekyll-theme-minimal

# Markdown & 公式渲染
markdown: kramdown
kramdown:
  math_engine: mathjax
  highlighter: rouge 
  input: GFM
  # incremental: true  # 注意：incremental 应该直接写在顶层，不属于 kramdown 子项
incremental: true

# head_custom 通常不需要写在顶层配置，除非主题有特殊要求
# 默认 Cayman 只要在 _includes 下有 head-custom.html 会自动加载

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-toc

toc:
  min_level: 2
  max_level: 4
  
paginate: 10              

header_pages: 
  - index.md
  
nav:
  - title: 首页
    url: /
  - title: 数学笔记
    url: /Notes/Math/
  - title: 其他笔记
    url: /Notes/other/
