title: 笔记
description: ""
baseurl: "/JNBNotes"
url: "https://gene5is.github.io"

# 远程主题
remote_theme: cotes2020/jekyll-theme-chirpy
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 功能
incremental: false
mathjax: true
toc: true
paginate: 10

# 导航
nav:
  - title: 首页
    url: /
  - title: 数学笔记
    url: /Notes/Math/
  - title: 其他笔记
    url: /Notes/other/

# 关闭不兼容配置
theme: null
