title: JNBNotes
description: 个人笔记
baseurl: "/JNBNotes"
url: "https://gene5is.github.io"

theme: jekyll-theme-architect

# Markdown & 公式渲染（支持 LaTeX）
markdown: kramdown
kramdown:
  math_engine: mathjax
  highlighter: rouge 
  input: GFM
  incremental: true  

head_custom: _includes/head-custom.html
plugins:
  - jekyll-feed
  - jekyll-paginate
  
paginate: 10              # 每页显示的文章数量
