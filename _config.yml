# 官方主题 minima v3
theme: minima

minima:
  skin: auto
  date_format: "%b-%d-%Y"
  nav_pages:
    - index.md
    - categories.md
    - about.md

# /Notes 笔记目录
collections:
  Notes:
    output: true
    permalink: /Notes/:title/

# 构建配置（官方原版）
markdown: kramdown
kramdown:
  input: GFM

mathjax: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 网址
url: "https://gene5is.github.io"
baseurl: ""
