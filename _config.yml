title: 笔记
description: 
baseurl: "/JNBNotes"
url: "https://gene5is.github.io"

theme: jekyll-theme-cayman

# Markdown & 公式渲染（支持 LaTeX）
markdown: kramdown
kramdown:
  math_engine: mathjax
  highlighter: rouge 
  input: GFM
  incremental: true  

head_custom: _includes/head-custom.html
plugins:
  - jekyll-feed
  - jekyll-paginate
  
paginate: 10              # 每页显示的文章数量

header_pages: 
  - index.md

  nav:
  - title: 首页
    url: /JNBNotes/index.md
  - title: 数学笔记
    url: /Notes/Math/
  - title: 其他笔记
    url: /Notes/other/
